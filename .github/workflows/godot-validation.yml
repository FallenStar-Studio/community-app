name: Godot headless validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 stable
        run: |
          curl -fsSL 'https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project resources
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run data and model tests
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/tests/test_runner.gd
